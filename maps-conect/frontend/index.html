<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | MAPS Connect</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="login-page">
    <div class="auth-layout">
        <div class="auth-card card">
            <h1 class="page-title">Iniciar sesión</h1>
            <div id="alert-container"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
            </form>
            <p class="form-hint" style="margin-top:1rem;text-align:center">
                Acceso provisional: <strong>demo@tecmilenio.mx</strong> / <strong>Demo1234</strong>
            </p>
            <p style="margin-top:0.5rem;text-align:center">
                <a href="registro.html">Crear cuenta</a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
